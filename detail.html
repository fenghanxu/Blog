<!doctype html>
<html lang="zh-CN">
<head>
<!-- 文章详情页：按 detail.html?id=文章ID 从 IndexedDB 读取文章 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章详情 · 字间</title>
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<link rel="stylesheet" href="assets/css/detail.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 16 16"><path d="M3 13h2.1l6.9-6.9a1.7 1.7 0 0 0 0-2.4l-.7-.7a1.7 1.7 0 0 0-2.4 0L3 9.9Z"/><path d="M9.6 3.6 12.4 6.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S3.9 3.8 8 3.8 14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.2 1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M6 4h8M6 8h8M6 12h8"/><path d="M2.6 4h.01M2.6 8h.01M2.6 12h.01" stroke-width="2.2"/></symbol>
</svg>

<header class="topbar">
  <a class="back" href="index.html"><svg class="icon"><use href="#i-back"/></svg>返回列表</a>
  <div class="brand"><span class="mark">字</span>字间</div>
  <span class="crumb">/ 文章</span>
  <div class="top-actions">
    <a class="ghost-btn" id="editLink" href="edit.html"><svg class="icon"><use href="#i-pen"/></svg><span>编辑文章</span></a>
    <a class="primary-btn" href="edit.html"><svg class="icon"><use href="#i-plus"/></svg>写文章</a>
  </div>
</header>

<div class="page-state" id="pageState">
  <span class="loading-dot" aria-hidden="true"></span>
  <h1>正在打开文章…</h1>
  <p>从本地数据库读取内容</p>
</div>

<main class="shell" id="articleShell" hidden>
  <article class="article-card">
    <header class="article-head">
      <div class="eyebrow" id="articleCat">文章</div>
      <h1 class="article-title" id="articleTitle"></h1>
      <p class="lead" id="articleSummary" hidden></p>
      <div class="article-meta">
        <strong>冯汉栩</strong>
        <span class="dot">·</span>
        <span id="articleDate"></span>
        <span class="dot">·</span>
        <span class="stat"><svg class="icon"><use href="#i-eye"/></svg>阅读 <b id="articleReads">0</b></span>
      </div>
      <div class="tag-row" id="articleTags"></div>
    </header>

    <div class="content" id="articleContent"></div>

    <footer class="article-foot">
      <span id="articleUpdated"></span>
      <div class="foot-actions">
        <a href="index.html"><svg class="icon"><use href="#i-back"/></svg>全部文章</a>
        <a id="footEditLink" href="edit.html"><svg class="icon"><use href="#i-pen"/></svg>继续编辑</a>
      </div>
    </footer>
  </article>

  <aside class="side">
    <section class="side-card">
      <h2 class="side-title">关于作者</h2>
      <div class="author">
        <span class="avatar">冯</span>
        <div><b>冯汉栩</b><span>iOS 开发工程师</span></div>
      </div>
      <div class="side-stats">
        <div><b id="sideReads">0</b>阅读</div>
        <div><b id="sideLikes">0</b>点赞</div>
        <div><b id="sideSections">0</b>小节</div>
      </div>
    </section>

    <section class="side-card" id="tocCard" hidden>
      <h2 class="side-title">文章目录 <span class="badge" id="tocBadge">0 节</span></h2>
      <nav class="toc-list" id="tocList"></nav>
    </section>

    <section class="side-card" id="tagCard" hidden>
      <h2 class="side-title">文章标签</h2>
      <div class="side-tags" id="sideTags"></div>
    </section>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/shared.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/detail.js"></script>
</body>
</html>
