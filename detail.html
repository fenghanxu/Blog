<!doctype html>
<html lang="zh-CN">
<head>
<!-- 文章详情页：按 detail.html?id=文章ID 从 IndexedDB 读取文章 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章详情 · 字间</title>
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<link rel="stylesheet" href="assets/css/detail.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 16 16"><path d="M3 13h2.1l6.9-6.9a1.7 1.7 0 0 0 0-2.4l-.7-.7a1.7 1.7 0 0 0-2.4 0L3 9.9Z"/><path d="M9.6 3.6 12.4 6.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S3.9 3.8 8 3.8 14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.2 1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M6 4h8M6 8h8M6 12h8"/><path d="M2.6 4h.01M2.6 8h.01M2.6 12h.01" stroke-width="2.2"/></symbol>
</svg>

<div class="page-state" id="pageState">
  <span class="loading-dot" aria-hidden="true"></span>
  <h1>正在打开文章…</h1>
  <p>从本地数据库读取内容</p>
</div>

<main class="shell" id="articleShell" hidden>
  <article class="article-card">
    <header class="article-head">
      <h1 class="article-title" id="articleTitle"></h1>
      <p class="lead" id="articleSummary" hidden></p>
      <div class="article-meta">
        <strong>作者: 冯汉栩</strong>
        <span class="dot">·</span>
        <span id="articleDate"></span>
        <span class="dot">·</span>
        <span class="stat"><svg class="icon"><use href="#i-eye"/></svg>阅读 <b id="articleReads">0</b></span>
        <span class="dot">·</span>
        <a class="meta-edit" id="editLink" href="edit.html">编辑</a>
      </div>
      <div class="tag-row" id="articleTags"></div>
    </header>

    <div class="content" id="articleContent"></div>

    <footer class="article-foot">
      <span id="articleUpdated"></span>
      <div class="foot-actions">
        <a href="index.html"><svg class="icon"><use href="#i-back"/></svg>全部文章</a>
        <a id="footEditLink" href="edit.html"><svg class="icon"><use href="#i-pen"/></svg>继续编辑</a>
      </div>
    </footer>
  </article>

  <aside class="side">
    <section class="side-card" id="tocCard" hidden>
      <h2 class="side-title">文章目录 <span class="badge" id="tocBadge">0 节</span></h2>
      <nav class="toc-list" id="tocList"></nav>
    </section>

  </aside>
</main>

<div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
  <div class="image-viewer-mask" data-image-close></div>
  <button type="button" class="image-viewer-close" data-image-close aria-label="关闭图片预览">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
  </button>
  <div class="image-viewer-stage" id="imageViewerStage">
    <button type="button" class="image-viewer-nav is-prev" id="imageViewerPrev" aria-label="上一张图片">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></svg>
    </button>
    <img class="image-viewer-img" id="imageViewerImg" alt="" draggable="false">
    <button type="button" class="image-viewer-nav is-next" id="imageViewerNext" aria-label="下一张图片">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 3.5 10.7 8l-4.5 4.5"/></svg>
    </button>
  </div>
  <div class="image-viewer-bar">
    <div class="image-viewer-info">
      <span id="imageViewerCounter">1 / 1</span>
      <span class="image-viewer-caption" id="imageViewerCaption"></span>
    </div>
    <div class="image-viewer-tools" role="group" aria-label="图片缩放">
      <button type="button" class="image-viewer-tool" id="imageViewerZoomOut" aria-label="缩小">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8h9.2"/></svg>
      </button>
      <span class="image-viewer-zoom" id="imageViewerZoom">100%</span>
      <button type="button" class="image-viewer-tool" id="imageViewerZoomIn" aria-label="放大">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
      </button>
      <span class="image-viewer-divider" aria-hidden="true"></span>
      <button type="button" class="image-viewer-tool is-text" id="imageViewerActual" title="按原始像素大小查看">1:1</button>
      <button type="button" class="image-viewer-tool is-text" id="imageViewerReset" title="恢复适应屏幕">还原</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/shared.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/detail.js"></script>
</body>
</html>
