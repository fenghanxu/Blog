  <script>
    const md = `# 深拷贝与浅拷贝

在 Swift 项目中，理解值类型与引用类型的拷贝行为，可以帮助我们避免意料之外的数据修改。下面结合项目里的分割线组件，记录一次实际开发中的思考。

## 1. 先看一个实际场景

开发购票页面时，我们需要在视图中间添加一条轻量的分割线。封装成独立组件之后，布局代码会更加清晰：

\`\`\`swift
let separatorLine = DashLineView()
separatorLine.lineColor = .lightGray
separatorLine.translatesAutoresizingMaskIntoConstraints = false
view.addSubview(separatorLine)

separatorLine.snp.makeConstraints { make in
    make.center.equalToSuperview()
    make.width.equalToSuperview()
    make.height.equalTo(1)
}
\`\`\`

### 1.1 为什么要封装

封装的目的不只是减少重复代码，也包括让**视图职责更清楚**。当组件只负责绘制分割线，调用方就不必关心内部实现。

> 一个好的小组件，应该让使用方式足够直观，同时把变化控制在自己的边界内。

## 2. 值类型和引用类型

Swift 的结构体和枚举是值类型，赋值时会产生独立的值；类是引用类型，赋值后多个变量可能指向同一个实例。

| 类型 | 赋值行为 | 修改影响 |
| --- | --- | --- |
| struct / enum | 值拷贝 | 各自独立 |
| class | 共享引用 | 可能互相影响 |

### 2.1 一个简单例子

\`\`\`swift
struct Ticket {
    var seat: String
}

var first = Ticket(seat: "A12")
var second = first
second.seat = "B08"

print(first.seat)  // A12
print(second.seat) // B08
\`\`\`

## 3. 开发中的检查清单

1. 明确模型是值类型还是引用类型。
2. 检查集合中是否包含可变引用对象。
3. 需要隔离状态时，在边界处显式复制数据。

配图可以通过 Markdown 图片语法插入：

![代码工作台示意图](https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80)

## 4. 小结

写页面时遇到的数据共享问题，通常可以从类型语义和对象所有权入手。先确认数据该不该共享，再选择合适的模型，代码就会更容易维护。

行内代码：\`let copy = original\`。`;
    const source = document.getElementById('source'); source.value = md; function render() {
      const box = document.getElementById('content');
      if (!window.marked) { box.textContent = source.value; return }
      const esc = v => String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      const renderer = new marked.Renderer();
      renderer.code = (token, info) => {
        const isStr = typeof token === 'string';
        const body = esc(isStr ? token : (token && token.text) || '');
        const lang = String((isStr ? info : (token && token.lang)) || 'text').replace(/[^a-z0-9+#.-]/gi, '') || 'text';
        return '<div class=code><div class=codehead><span>' + lang + '</span>'
          + '<button type=button onclick="navigator.clipboard.writeText(this.closest(\'.code\').querySelector(\'code\').innerText)">复制代码</button>'
          + '</div><pre><code>' + body + '</code></pre></div>';
      };
      marked.setOptions({ renderer, gfm: true });
      const html = marked.parse(source.value);
      box.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
      [...box.querySelectorAll('h1,h2,h3')].forEach((h, i) => { h.id = 'heading-' + i });
    }
    document.getElementById('update').onclick = render; render()
