<!doctype html>
<html lang="zh-CN">
<head>
<!-- 文章编辑器：结构在本文件，样式在 assets/css/edit.css，交互在 assets/js/edit.js -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写文章 · 字间</title>
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<link rel="stylesheet" href="assets/css/edit.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></symbol>
  <symbol id="i-md" viewBox="0 0 16 16"><rect x="1.8" y="3.2" width="12.4" height="9.6" rx="2.2"/><path d="M4.4 10.3V6.2l2 2.1 2-2.1v4.1"/><path d="M11.4 6.2v4.1M9.9 8.8l1.5 1.5"/></symbol>
  <symbol id="i-split" viewBox="0 0 16 16"><rect x="1.8" y="3.2" width="12.4" height="9.6" rx="2.2"/><path d="M8 3.2v9.6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S3.9 3.8 8 3.8 14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.7"/></symbol>
  <symbol id="i-swap" viewBox="0 0 16 16"><path d="M2.6 6h9.2M9.4 3.6 11.8 6M13.4 10H4.2M6.6 12.4 4.2 10"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M6 4h8M6 8h8M6 12h8"/><path d="M2.6 4h.01M2.6 8h.01M2.6 12h.01" stroke-width="2.2"/></symbol>
  <symbol id="i-code" viewBox="0 0 16 16"><path d="M6.2 4 2.6 8l3.6 4M9.8 4 13.4 8l-3.6 4"/></symbol>
  <symbol id="i-image" viewBox="0 0 16 16"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><circle cx="5.6" cy="6.4" r="1.1"/><path d="M2.6 11.4 6 8.4l2.2 2 1.9-1.6 3.2 2.8"/></symbol>
  <symbol id="i-video" viewBox="0 0 16 16"><rect x="1.8" y="3.4" width="12.4" height="9.2" rx="2.2"/><path d="M6.6 6.2 9.8 8l-3.2 1.8Z"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l1.9-1.9a2.6 2.6 0 0 0-3.7-3.7L7.6 4.7"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.8 8.5a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></symbol>
  <symbol id="i-draft" viewBox="0 0 16 16"><path d="M4 2.4h5l3 3v8.2H4z"/><path d="M6.2 7.6h3.6M6.2 10.2h2.4"/></symbol>
  <symbol id="i-history" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.2 1.5"/></symbol>
  <symbol id="i-caret" viewBox="0 0 16 16"><path d="m4.8 6.4 3.2 3.2 3.2-3.2"/></symbol>
  <symbol id="i-grip" viewBox="0 0 16 16"><path d="M5.6 4h.01M10.4 4h.01M5.6 8h.01M10.4 8h.01M5.6 12h.01M10.4 12h.01" stroke-width="2.6"/></symbol>
  <symbol id="i-toc" viewBox="0 0 16 16"><path d="M5.4 4h8M5.4 8h8M5.4 12h8"/><path d="M2.4 4h.01M2.4 8h.01M2.4 12h.01" stroke-width="2.2"/></symbol>
  <symbol id="i-pen" viewBox="0 0 16 16"><path d="M3 13h2.1l6.9-6.9a1.7 1.7 0 0 0 0-2.4l-.7-.7a1.7 1.7 0 0 0-2.4 0L3 9.9Z"/><path d="M9.6 3.6 12.4 6.4"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.8"/><path d="M8 7.3v3.3M8 5.2h.01" stroke-width="1.8"/></symbol>
  <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 2.6 9.4 6.2 13 7.6 9.4 9 8 12.6 6.6 9 3 7.6 6.6 6.2Z"/><path d="M12.4 11.2v2.2M11.3 12.3h2.2"/></symbol>
  <symbol id="i-book" viewBox="0 0 16 16"><path d="M3 3.2h3.2A1.8 1.8 0 0 1 8 4.3a1.8 1.8 0 0 1 1.8-1.1H13v8.8H9.7a1.7 1.7 0 0 0-1.7 1.1 1.7 1.7 0 0 0-1.7-1.1H3Z"/><path d="M8 4.4v7.8"/></symbol>
</svg>

<header class="topbar">
  <a class="back" href="index.html" id="backLink"><svg class="icon"><use href="#i-back"/></svg><span>返回列表</span></a>
  <div class="title-wrap">
    <span class="title-icon" aria-hidden="true"><svg class="icon"><use href="#i-pen"/></svg></span>
    <input id="title" class="title-input" type="text" maxlength="100" placeholder="【无标题】" autocomplete="off" spellcheck="false" aria-label="文章标题">
    <span id="titleCount" class="title-count">0/100</span>
  </div>
</header>

<main class="workspace" id="workspace">
  <section class="editor">
    <div class="editor-head">
      <div class="mode-tabs" role="tablist" aria-label="编辑模式">
        <button class="mode" data-mode="edit" role="tab" aria-selected="false"><svg class="icon"><use href="#i-md"/></svg>Markdown</button>
        <button class="mode is-active" data-mode="split" role="tab" aria-selected="true"><svg class="icon"><use href="#i-split"/></svg>比对</button>
        <button class="mode" data-mode="preview" role="tab" aria-selected="false"><svg class="icon"><use href="#i-eye"/></svg>预览</button>
      </div>
      <button class="rich-btn" id="richBtn" type="button"><svg class="icon"><use href="#i-swap"/></svg><span>使用富文本编辑器</span></button>
    </div>

    <details class="meta-panel" id="metaPanel" open>
      <summary>
        <span class="meta-panel-icon" aria-hidden="true"><svg class="icon"><use href="#i-doc"/></svg></span>
        <b>文章信息</b>
        <span class="meta-panel-brief" id="metaBrief">选择分类，补充标签和摘要</span>
        <svg class="icon meta-caret"><use href="#i-caret"/></svg>
      </summary>
      <div class="meta-panel-body">
        <label class="meta-field">
          <span>分类</span>
          <select id="category"></select>
        </label>
        <label class="meta-field">
          <span>标签</span>
          <input id="tagsInput" type="text" maxlength="120" placeholder="用逗号分隔，如：Swift, 组件化" autocomplete="off">
        </label>
        <label class="meta-field meta-field-wide">
          <span>摘要 <em id="summaryCount">0/160</em></span>
          <textarea id="summaryInput" maxlength="160" rows="2" placeholder="留空时自动截取正文开头"></textarea>
        </label>
      </div>
    </details>

    <div class="toolbar" id="toolbar">
      <div class="tool-group">
        <button class="tool" type="button" data-cmd="bold" title="加粗 (⌘B)"><b>B</b></button>
        <button class="tool" type="button" data-cmd="italic" title="斜体 (⌘I)"><i>I</i></button>
        <button class="tool" type="button" data-cmd="heading" title="标题">H</button>
        <button class="tool" type="button" data-cmd="strike" title="删除线"><s>S</s></button>
      </div>
      <span class="tool-sep"></span>
      <div class="tool-group">
        <button class="tool has-caret" type="button" data-menu="menu-list"><svg class="icon"><use href="#i-list"/></svg>列表<svg class="icon caret"><use href="#i-caret"/></svg></button>
        <button class="tool has-caret" type="button" data-menu="menu-code"><svg class="icon"><use href="#i-code"/></svg>代码块<svg class="icon caret"><use href="#i-caret"/></svg></button>
        <button class="tool has-caret" type="button" data-menu="menu-format">更多格式<svg class="icon caret"><use href="#i-caret"/></svg></button>
      </div>
      <span class="tool-sep"></span>
      <div class="tool-group">
        <button class="tool tool-icon" type="button" data-cmd="image" title="插入图片"><svg class="icon"><use href="#i-image"/></svg></button>
        <button class="tool tool-icon" type="button" data-cmd="video" title="插入视频（B 站 / MP4 直链）"><svg class="icon"><use href="#i-video"/></svg></button>
        <button class="tool tool-icon" type="button" data-cmd="link" title="插入链接"><svg class="icon"><use href="#i-link"/></svg></button>
        <button class="tool has-caret" type="button" data-menu="menu-insert">更多插入<svg class="icon caret"><use href="#i-caret"/></svg></button>
      </div>
      <span class="tool-sep"></span>
      <div class="tool-group">
        <button class="tool tool-icon has-dot" type="button" data-cmd="save" title="保存草稿"><svg class="icon"><use href="#i-draft"/></svg></button>
        <button class="tool is-disabled" type="button" data-cmd="history" title="历史版本（暂未开放）"><svg class="icon"><use href="#i-history"/></svg>历史版本</button>
        <button class="tool has-caret" type="button" data-menu="menu-more">更多操作<svg class="icon caret"><use href="#i-caret"/></svg></button>
      </div>
    </div>

    <div class="panes" id="panes" data-mode="split">
      <div class="pane pane-edit">
        <textarea id="source" spellcheck="false" placeholder="开始写作，支持 Markdown 语法……" aria-label="Markdown 正文"></textarea>
      </div>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="拖动调整分栏宽度" tabindex="0">
        <span class="splitter-line"></span>
        <button class="splitter-grip" type="button" id="resetSplit" title="双击恢复等宽"><svg class="icon"><use href="#i-grip"/></svg></button>
      </div>
      <div class="pane pane-preview">
        <article class="markdown-body" id="preview"></article>
      </div>
    </div>

    <footer class="editor-foot">
      <div class="foot-left">
        <span class="foot-info" aria-hidden="true"><svg class="icon"><use href="#i-info"/></svg></span>
        <div class="stats">
          <div><span class="stats-tag">Markdown</span><b id="statChars">0</b> 字数 <b id="statLines">0</b> 行数 当前行 <b id="statLine">1</b>，当前列 <b id="statCol">0</b></div>
          <div><span class="stats-tag">HTML</span><b id="statHtmlChars">0</b> 字数 <b id="statParas">0</b> 段落</div>
        </div>
      </div>
      <div class="foot-actions">
        <div class="draft-split">
          <button class="draft-btn" type="button" id="draftBtn"><svg class="icon"><use href="#i-draft"/></svg>保存草稿</button>
          <button class="draft-caret" type="button" id="draftCaret" data-menu="menu-draft" aria-label="草稿选项"><svg class="icon"><use href="#i-caret"/></svg></button>
        </div>
        <button class="publish-btn" type="button" id="publishBtn"><svg class="icon"><use href="#i-spark"/></svg><span id="publishText">发布文章</span></button>
      </div>
    </footer>
  </section>

  <aside class="toc" id="tocPanel" aria-label="文章目录">
    <div class="toc-head">
      <div class="toc-title">
        <span class="toc-title-icon" aria-hidden="true"><svg class="icon"><use href="#i-book"/></svg></span>
        <div>
          <b>文章目录</b>
          <div class="toc-sub">根据标题自动生成</div>
        </div>
      </div>
      <span class="badge" id="tocBadge">0 节</span>
    </div>
    <div class="toc-empty" id="tocEmpty">
      <p>暂无目录</p>
      <p class="toc-hint">文章内添加<code>@[TOC]</code>自动根据文章标题生成目录</p>
    </div>
    <nav class="toc-list" id="tocList" hidden></nav>
  </aside>
</main>

<div class="rail">
  <button class="rail-btn rail-toc" type="button" id="tocToggle" aria-expanded="true" title="收起/展开目录"><svg class="icon"><use href="#i-toc"/></svg><span>目录</span></button>
  <button class="rail-btn rail-feedback" type="button" id="feedbackBtn" title="反馈"><span>反馈</span></button>
</div>

<div class="menu" id="menu-list" role="menu">
  <button type="button" data-cmd="ul">无序列表<span class="menu-key">- </span></button>
  <button type="button" data-cmd="ol">有序列表<span class="menu-key">1. </span></button>
  <button type="button" data-cmd="task">任务列表<span class="menu-key">- [ ]</span></button>
</div>
<div class="menu" id="menu-code" role="menu">
  <button type="button" data-cmd="inline-code">行内代码<span class="menu-key">` `</span></button>
  <button type="button" data-cmd="code-block">代码块<span class="menu-key">```</span></button>
</div>
<div class="menu" id="menu-format" role="menu">
  <button type="button" data-cmd="quote">引用<span class="menu-key">&gt;</span></button>
  <button type="button" data-cmd="table">表格<span class="menu-key">| |</span></button>
  <button type="button" data-cmd="hr">分割线<span class="menu-key">---</span></button>
  <button type="button" data-cmd="h3">三级标题<span class="menu-key">###</span></button>
</div>
<div class="menu" id="menu-insert" role="menu">
  <button type="button" data-cmd="toc">目录标记<span class="menu-key">@[TOC]</span></button>
  <button type="button" data-cmd="table">插入表格</button>
  <button type="button" data-cmd="image">本地上传图片</button>
  <button type="button" data-cmd="image-url">网络图片</button>
  <button type="button" data-cmd="video">插入视频<span class="menu-key">B 站 / MP4</span></button>
</div>
<div class="menu" id="menu-more" role="menu">
  <button type="button" data-cmd="export">导出 Markdown</button>
  <button type="button" data-cmd="copy-html">复制 HTML</button>
  <button type="button" data-cmd="clear">清空正文</button>
  <button type="button" class="danger" data-cmd="delete">删除文章</button>
</div>
<div class="menu" id="menu-draft" role="menu">
  <button type="button" data-cmd="save">保存草稿</button>
  <button type="button" data-cmd="clear-draft">清除本地草稿</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="video-dialog" id="videoDialog" hidden>
  <div class="video-dialog-mask" data-video-close></div>
  <form class="video-dialog-card" id="videoForm" role="dialog" aria-modal="true" aria-labelledby="videoDialogTitle">
    <h3 id="videoDialogTitle">插入视频</h3>
    <p class="video-dialog-hint">粘贴 B 站视频页链接或 MP4 直链，会自动生成对应的播放器。</p>
    <input id="videoUrl" class="video-dialog-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="粘贴 B 站视频页地址，或 https://.../movie.mp4">
    <p class="video-dialog-error" id="videoError" hidden></p>
    <div class="video-dialog-foot">
      <button type="button" class="video-dialog-btn" data-video-close>取消</button>
      <button type="submit" class="video-dialog-btn is-primary">插入</button>
    </div>
  </form>
</div>
<input type="file" id="imageFile" accept="image/*" multiple hidden>

<script src="assets/js/shared.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/edit.js"></script>
</body>
</html>
