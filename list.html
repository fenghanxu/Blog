<!doctype html>
<html lang="zh-CN">
<head>
<!-- 文章列表页：结构在本文件，样式在 assets/css/list.css，数据与交互在 assets/js/list.js -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部文章 · 字间</title>
<link rel="stylesheet" href="assets/css/list.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="4.4"/><path d="m10.6 10.6 2.6 2.6"/></symbol>
  <symbol id="i-caret" viewBox="0 0 16 16"><path d="m4.8 6.4 3.2 3.2 3.2-3.2"/></symbol>
  <symbol id="i-heart" viewBox="0 0 16 16"><path d="M8 13.1 3.9 9.2A2.9 2.9 0 0 1 8 5.1a2.9 2.9 0 0 1 4.1 4.1Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3.4 8h9M9.2 4.8 12.4 8l-3.2 3.2"/></symbol>
  <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 2.4h5l3 3v8.2H4z"/><path d="M6.2 7.6h3.6M6.2 10.2h2.4"/></symbol>
</svg>

<header class="topbar">
  <a class="write-btn" href="edit.html"><svg class="icon"><use href="#i-plus"/></svg>写文章</a>

  <nav class="tabs" id="tabs" aria-label="文章分类">
    <button class="tab is-active" type="button" data-cat="all">全部文章</button>
    <button class="tab" type="button" data-cat="frontend">前端开发<span class="tab-count" data-count="frontend">00</span></button>
    <button class="tab" type="button" data-cat="backend">后端架构<span class="tab-count" data-count="backend">00</span></button>
    <button class="tab" type="button" data-cat="ai">AI 与工具<span class="tab-count" data-count="ai">00</span></button>
    <button class="tab" type="button" data-cat="engineering">工程效率<span class="tab-count" data-count="engineering">00</span></button>
    <button class="tab" type="button" data-cat="essay">随笔<span class="tab-count" data-count="essay">00</span></button>
  </nav>

  <div class="tools">
    <label class="sort">
      <span class="sort-label">排序：</span>
      <select id="sortSelect" aria-label="排序方式">
        <option value="latest">最新发布</option>
        <option value="reads">最多阅读</option>
        <option value="likes">最多点赞</option>
      </select>
      <svg class="icon caret"><use href="#i-caret"/></svg>
    </label>

    <label class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="搜索文章 / 标签..." autocomplete="off" aria-label="搜索文章">
    </label>
  </div>
</header>

<main class="shell">
  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <h1 id="listTitle">最新发布</h1>
        <span class="count-pill" id="totalCount">共 0 篇</span>
      </div>
      <div class="panel-hint">
        <svg class="icon"><use href="#i-doc"/></svg>
        <span>持续记录，写给未来的自己</span>
      </div>
    </div>

    <div class="article-list" id="articleList" aria-live="polite"></div>

    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-icon"><svg class="icon"><use href="#i-search"/></svg></div>
      <p class="empty-title">没有找到相关文章</p>
      <p class="empty-hint">换个关键词，或者切回“全部文章”看看</p>
      <button class="empty-btn" type="button" id="resetFilter">重置筛选</button>
    </div>

    <footer class="panel-foot">
      <span class="range" id="rangeInfo">显示 0-0 篇，共 0 篇</span>
      <nav class="pager" id="pager" aria-label="分页"></nav>
    </footer>
  </section>
</main>

<script src="assets/js/list.js"></script>
</body>
</html>
