<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="author" content="{{AUTHOR}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#8b5cf6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/list.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="4.4"/><path d="m10.6 10.6 2.6 2.6"/></symbol>
  <symbol id="i-caret" viewBox="0 0 16 16"><path d="m4.8 6.4 3.2 3.2 3.2-3.2"/></symbol>
  <symbol id="i-tags" viewBox="0 0 16 16"><path d="M2.5 3.6c0-.6.5-1.1 1.1-1.1h3.2v4.2L3.5 10 2.5 9V3.6ZM9.2 3.6c0-.6.5-1.1 1.1-1.1h2.5c.6 0 1.1.5 1.1 1.1v2.5L8.2 12 5.6 9.4l3.6-5.8Z"/></symbol>
  <symbol id="i-tag" viewBox="0 0 16 16"><path d="M2.4 3.1c0-.4.3-.7.7-.7h3.3l7.2 7.2-4 4L2.4 6.4V3.1Z"/><circle cx="5.1" cy="5.1" r=".85"/></symbol>
  <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 2.4h5l3 3v8.2H4z"/><path d="M6.2 7.6h3.6M6.2 10.2h2.4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S3.9 3.8 8 3.8 14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.7"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3.4 8h9M9.2 4.8 12.4 8l-3.2 3.2"/></symbol>
  <symbol id="i-heart" viewBox="0 0 16 16"><path d="M8 13.1 3.9 9.2A2.9 2.9 0 0 1 8 5.1a2.9 2.9 0 0 1 4.1 4.1Z"/></symbol>
</svg>

<header class="topbar">
  <a class="site-brand" href="index.html">
    <span class="site-brand-mark" aria-hidden="true">字</span>
    <span class="site-brand-text">
      <b>{{SITE_NAME}}</b>
      <em>{{TAGLINE}}</em>
    </span>
  </a>

  <div class="category-filter" id="categoryFilter">
    <button class="category-filter-btn" id="categoryFilterBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="categoryMenu">
      <svg class="icon"><use href="#i-tags"/></svg><span>分类</span>
      <svg class="icon category-filter-caret"><use href="#i-caret"/></svg>
    </button>
    <div class="category-menu" id="categoryMenu" role="menu" aria-label="选择分类" hidden></div>
  </div>

  <div class="category-filter tag-filter" id="tagFilter">
    <button class="category-filter-btn" id="tagFilterBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tagMenu">
      <svg class="icon"><use href="#i-tag"/></svg><span>标签</span>
      <svg class="icon category-filter-caret"><use href="#i-caret"/></svg>
    </button>
    <div class="category-menu" id="tagMenu" role="menu" aria-label="选择标签" hidden></div>
  </div>

  <div class="tools">
    <label class="sort">
      <span class="sort-label">排序：</span>
      <select id="sortSelect" aria-label="排序方式">
        <option value="latest">最新发布</option>
        <option value="reads">最多阅读</option>
        <option value="likes">最多喜欢</option>
      </select>
      <svg class="icon caret"><use href="#i-caret"/></svg>
    </label>

    <label class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="搜索文章 / 标签…" autocomplete="off" aria-label="搜索文章">
    </label>
  </div>
</header>

<main class="shell">
  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <h1 id="listTitle">全部文章</h1>
        <span class="count-pill" id="totalCount">共 {{TOTAL}} 篇</span>
      </div>
      <div class="panel-hint">
        <svg class="icon"><use href="#i-doc"/></svg>
        <span>{{TAGLINE}}</span>
      </div>
    </div>

    <div class="article-list" id="articleList" aria-live="polite">{{STATIC_ROWS}}
    </div>

    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-icon"><svg class="icon"><use href="#i-search"/></svg></div>
      <p class="empty-title">没有找到相关文章</p>
      <p class="empty-hint">换个关键词，或者切回“全部文章”看看</p>
      <button class="empty-btn" type="button" id="resetFilter">重置筛选</button>
    </div>

    <footer class="panel-foot">
      <span class="range" id="rangeInfo">共 {{TOTAL}} 篇</span>
      <nav class="pager" id="pager" aria-label="分页"></nav>
    </footer>
  </section>
</main>

<footer class="site-foot">
  <span>© {{YEAR}} {{AUTHOR}}</span>
  <span class="dot">·</span>
  <span>由 <a href="index.html">{{SITE_NAME}}</a> 生成</span>
</footer>

<script type="application/json" id="blogData">{{DATA_JSON}}</script>
<script src="assets/js/index.js"></script>
</body>
</html>
