<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="author" content="{{AUTHOR}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{ARTICLE_TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
{{OG_IMAGE_TAG}}
<meta property="article:published_time" content="{{PUBLISHED}}">
<meta property="article:modified_time" content="{{MODIFIED}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#8b5cf6">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/detail.css">
<link rel="stylesheet" href="../assets/css/site.css">
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S3.9 3.8 8 3.8 14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.2 1.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m4.4 4.4 7.2 7.2M11.6 4.4l-7.2 7.2"/></symbol>
</svg>

<header class="site-topbar">
  <a class="topbar-back" href="../index.html"><svg class="icon"><use href="#i-back"/></svg>全部文章</a>
  <span class="topbar-brand">{{SITE_NAME}}</span>
</header>

<main class="shell">
  <article class="article-card">
    <header class="article-head">
      <h1 class="article-title">{{ARTICLE_TITLE}}</h1>
      {{ARTICLE_SUMMARY_BLOCK}}
      <div class="article-meta">
        <strong>作者: {{AUTHOR}}</strong>
        <span class="dot">·</span>
        <span>{{DATE}}</span>
        <span class="dot">·</span>
        <span class="stat"><svg class="icon"><use href="#i-eye"/></svg>阅读 {{READS}}</span>
        <span class="dot">·</span>
        <span>{{CATEGORY}}</span>
      </div>
      {{TAGS_BLOCK}}
    </header>

    <div class="content">{{CONTENT}}</div>

    <footer class="article-foot">
      <span>最后更新于 {{UPDATED}}</span>
      <div class="foot-actions">
        <a href="../index.html"><svg class="icon"><use href="#i-back"/></svg>全部文章</a>
      </div>
    </footer>
  </article>

  <aside class="side">
    <section class="side-card" id="tocCard"{{TOC_CARD_HIDDEN}}>
      <h2 class="side-title">文章目录 <span class="badge">{{TOC_COUNT}} 节</span></h2>
      <nav class="toc-list" id="tocList">{{TOC}}</nav>
    </section>
    {{ADJACENT}}
  </aside>
</main>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-mask" data-close></div>
  <img id="lightboxImg" alt="">
  <button class="lightbox-close" type="button" data-close aria-label="关闭图片">
    <svg class="icon"><use href="#i-close"/></svg>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/post.js"></script>
</body>
</html>
